{{- /*
  Share box, reproduced verbatim from share/default.ejs's rendered output.

  data-id is a per-post hash Hexo generated. It is only used to build a unique
  DOM id for the popup, so an empty value is harmless here; Disqus thread
  identity is the separate concern noted in article.html.
*/ -}}
<a data-url="{{ .Permalink }}" data-id="{{ .Params.hexo_id | default "" }}" class="article-share-link"><i class="fa fa-share"></i>Share</a><script>!function(t){t("body").on("click",(function(){t(".article-share-box.on").removeClass("on")})).on("click",".article-share-link",(function(e){e.stopPropagation();var a,o=t(this),r=o.attr("data-url"),i=encodeURIComponent(r),s="article-share-box-"+o.attr("data-id"),l=o.offset();if(t("#"+s).length){if((a=t("#"+s)).hasClass("on"))return void a.removeClass("on")}else{var n=['<div id="'+s+'" class="article-share-box">','<input class="article-share-input" value="'+r+'">','<div class="article-share-links">','<a href="https://twitter.com/intent/tweet?url='+i+'" class="article-share-twitter" target="_blank" title="Twitter"></a>','<a href="https://www.facebook.com/sharer.php?u='+i+'" class="article-share-facebook" target="_blank" title="Facebook"></a>','<a href="http://pinterest.com/pin/create/button/?url='+i+'" class="article-share-pinterest" target="_blank" title="Pinterest"></a>','<a href="https://plus.google.com/share?url='+i+'" class="article-share-google" target="_blank" title="Google+"></a>',"</div>","</div>"].join("");a=t(n),t("body").append(a)}t(".article-share-box.on").hide(),a.css({top:l.top+25,left:l.left}).addClass("on")})).on("click",".article-share-box",(function(t){t.stopPropagation()})).on("click",".article-share-box-input",(function(){t(this).select()})).on("click",".article-share-box-link",(function(t){t.preventDefault(),t.stopPropagation(),window.open(this.href,"article-share-box-window-"+Date.now(),"width=500,height=450")}))}(jQuery)</script>
