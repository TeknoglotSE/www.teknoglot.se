baseURL = "https://www.teknoglot.se/"
locale = "en"
title = "teknoglot:"
themeColor = "#dd3333"

# Rendered dates are local wall-clock; the datetime attributes are UTC.
timeZone = "Europe/Stockholm"

# The generated site is committed to docs/ for GitHub Pages.
#
# These two keys MUST sit above the first table header in this file. TOML reads
# a bare key as belonging to the table it follows, so putting them after
# [taxonomies] silently nests them under it and Hugo falls back to public/.
publishDir = "docs"

# Hugo emits a /page/1/ copy of every paginated list, which the published site
# does not have: 167 extra pages otherwise. The global key covers content
# aliases, the pagination key below covers pagers.
disableAliases = true

# Every page carries an explicit `url` in its front matter. These preserve the
# site's established public paths.
#
# Native taxonomies stay off. The tags/categories here are plain front-matter
# data, not taxonomies: their URLs are nested (/topics/ms/opsmgr2012/), partly
# case-preserving (/topics/Events/, /tag/x64/) and partly orphaned, none of
# which a Hugo taxonomy can express. Enabling one would also make Hugo claim
# content/tags/ as its term container and the existing tag leaves would
# silently vanish from the build. Layouts for section/taxonomy/term kinds exist
# in layouts/_default/ for future content that does not collide with these.
[taxonomies]

[pagination]
  disableAliases = true
  pagerSize = 10

# Single newlines in the source render as <br>. Goldmark calls this
# hardWraps, and without it roughly half the posts render differently.
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # A single newline in the source becomes a <br>; the existing posts rely
      # on it in roughly half their bodies. This key lives under `renderer`, not
      # directly under `goldmark`, and is silently ignored in the wrong place.
      hardWraps = true
      # raw <acronym>, <span>, <table>, <script> in post bodies
      unsafe = true
    [markup.goldmark.parser]
      # Slugified IDs on content headings, e.g.
      # "# BRK1039 - Windows Server Software Defined" becomes
      # id="brk1039-windows-server-software-defined"
      autoHeadingID = true
      autoHeadingIDType = "github"
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    # no line numbers
    lineNos = false
    # highlight class on the wrapping <pre>
    noClasses = false
    style = "github"
    wrapperClass = "highlight"
    tabWidth = 4

[outputFormats]
  # Custom search index consumed by Insight.js at /content.json
  [outputFormats.contentjson]
    mediaType = "application/json"
    baseName = "content"
    isPlainText = true
    notAlternative = true
  # Keep the established public feed URL while using Hugo's built-in RSS
  # renderer. No custom RSS template is involved.
  [outputFormats.RSS]
    baseName = "rss"

[outputs]
  home = ["HTML", "contentjson", "RSS"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[services]
  [services.rss]
    limit = -1

[params]
  author = "Samuel Tegenfeldt"
  description = "Techspeak for the socially diminished."
  rssPath = "/rss.xml"
  favicon = "/favicon.png"
  disqusShortname = "teknoglotse"
  googleAnalytics = "UA-382656-8"
  perPage = 10
  # Tagcloud: min 10px, max 20px, interpolated by the RANK of a tag's
  # post count among the distinct counts, not linearly by the count itself.
  tagcloudMinFont = 10
  tagcloudMaxFont = 20
  links = [["Atea", "http://www.atea.se/"]]
  socialLinks = [["github", "https://github.com/stegenfeldt"], ["rss", "/rss.xml"]]
